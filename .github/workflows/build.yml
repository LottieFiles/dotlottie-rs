name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: "Target to build"
        required: true
        options:
          - "apple"
          - "android"
          - "wasm"
          - "linux"
          - "macos"
          - "windows"
          - "all"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ (matrix.platform == 'apple' || matrix.platform == 'macos') && 'macos-latest-large' || matrix.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.target == 'all' && '["apple","android","wasm","linux","macos","windows"]' || format('["{0}"]', inputs.target)) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - uses: ./.github/actions/build
        with:
          platform: ${{ matrix.platform }}
          upload: true
