name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  check:
    name: Check for an unreleased version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.tag.outputs.pending }}
    steps:
      - uses: actions/checkout@v5

      - name: Look for the version tag
        id: tag
        run: |
          tag="v$(grep -m1 '^version' dotlottie-rs/Cargo.toml | cut -d'"' -f2)"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || status=$?
          case "$status" in
            0) echo "$tag is already released" ;;
            2) echo "$tag is not released yet"; echo "pending=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    if: needs.check.outputs.pending == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest-large
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - uses: ./.github/actions/build
        with:
          platform: ${{ matrix.platform }}
          upload: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4.1.7
        with:
          path: release
          merge-multiple: true
      - name: Install Knope
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.22.3
      - run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CC: clang
      CXX: clang++
      AR: llvm-ar
      RANLIB: llvm-ranlib
      BINDGEN_EXTRA_CLANG_ARGS: "-I/usr/include"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y llvm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check ThorVG is packaged
        run: |
          cargo package --manifest-path=./dotlottie-rs/Cargo.toml --list \
            | grep -x deps/thorvg/src/bindings/capi/thorvg_capi.h > /dev/null

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - run: cargo publish --manifest-path=./dotlottie-rs/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
