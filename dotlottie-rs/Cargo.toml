[package]
name = "dotlottie-rs"
version = "0.1.60"
edition = "2021"
rust-version = "1.89"
description = "A high-performance Lottie and dotLottie player built with Rust"
license = "MIT"
repository = "https://github.com/LottieFiles/dotlottie-rs"
homepage = "https://docs.lottiefiles.com/en/runtimes"
keywords = ["lottie", "dotlottie", "animation", "graphics", "rendering"]
categories = ["graphics", "multimedia", "rendering"]
readme = "../README.md"
links = "thorvg"
include = [
    "/Cargo.toml",
    "/build.rs",
    "/cbindgen.toml",
    "/src/**",
    "/deps/thorvg/LICENSE",
    "/deps/thorvg/inc/**",
    "/deps/thorvg/src/**",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["rlib"]

[features]
default = ["dotlottie", "state-machines", "theming", "tvg-cpu", "tvg-png", "tvg-jpg", "tvg-webp", "tvg-ttf", "tvg-lottie-expressions", "tvg-threads"]
dev = ["tvg", "tvg-cpu", "tvg-lottie-expressions", "tvg-threads", "tvg-png", "tvg-jpg", "tvg-webp", "tvg-gif", "tvg-ttf", "tvg-otf", "c_api"]
c_api = ["dep:bitflags", "dep:cbindgen"]
tvg = []
tvg-log = []
tvg-cpu = ["tvg"]
tvg-wg = ["tvg"]
tvg-gl = ["tvg"]
tvg-lottie-expressions = []
tvg-jpg = []
tvg-png = []
tvg-webp = []
tvg-gif = []
tvg-ttf = []
tvg-otf = []
tvg-threads = []
tvg-simd = []
tracking_allocator = []
dotlottie = ["dep:miniz_oxide"]
state-machines = ["dotlottie"]
theming = ["dotlottie"]
wasm-bindgen-api = ["dep:console_error_panic_hook"]
webgl = ["wasm-bindgen-api", "web-sys/WebGl2RenderingContext", "web-sys/WebGlBuffer", "web-sys/WebGlFramebuffer", "web-sys/WebGlProgram", "web-sys/WebGlRenderbuffer", "web-sys/WebGlShader", "web-sys/WebGlTexture", "web-sys/WebGlUniformLocation", "web-sys/WebGlVertexArrayObject"]
webgpu = ["wasm-bindgen-api", "web-sys/GpuAdapter", "web-sys/GpuAddressMode", "web-sys/GpuBindGroup", "web-sys/GpuBindGroupDescriptor", "web-sys/GpuBindGroupEntry", "web-sys/GpuBindGroupLayout", "web-sys/GpuBindGroupLayoutDescriptor", "web-sys/GpuBindGroupLayoutEntry", "web-sys/GpuBlendComponent", "web-sys/GpuBlendFactor", "web-sys/GpuBlendOperation", "web-sys/GpuBlendState", "web-sys/GpuBuffer", "web-sys/GpuBufferBinding", "web-sys/GpuBufferBindingLayout", "web-sys/GpuBufferBindingType", "web-sys/GpuBufferDescriptor", "web-sys/GpuCanvasAlphaMode", "web-sys/GpuCanvasContext", "web-sys/GpuCanvasConfiguration", "web-sys/GpuColorDict", "web-sys/GpuColorTargetState", "web-sys/GpuCommandBuffer", "web-sys/GpuCommandBufferDescriptor", "web-sys/GpuCommandEncoder", "web-sys/GpuCommandEncoderDescriptor", "web-sys/GpuCompareFunction", "web-sys/GpuComputePassDescriptor", "web-sys/GpuComputePassEncoder", "web-sys/GpuComputePassTimestampWrites", "web-sys/GpuComputePipeline", "web-sys/GpuComputePipelineDescriptor", "web-sys/GpuCullMode", "web-sys/GpuDepthStencilState", "web-sys/GpuDevice", "web-sys/GpuExtent3dDict", "web-sys/GpuFilterMode", "web-sys/GpuFragmentState", "web-sys/GpuFrontFace", "web-sys/GpuIndexFormat", "web-sys/GpuLoadOp", "web-sys/GpuMipmapFilterMode", "web-sys/GpuMultisampleState", "web-sys/GpuPrimitiveState", "web-sys/GpuPrimitiveTopology", "web-sys/GpuPipelineLayout", "web-sys/GpuPipelineLayoutDescriptor", "web-sys/GpuProgrammableStage", "web-sys/GpuQuerySet", "web-sys/GpuQueue", "web-sys/GpuRenderPassColorAttachment", "web-sys/GpuRenderPassDepthStencilAttachment", "web-sys/GpuRenderPassDescriptor", "web-sys/GpuRenderPassEncoder", "web-sys/GpuRenderPassTimestampWrites", "web-sys/GpuRenderPipeline", "web-sys/GpuRenderPipelineDescriptor", "web-sys/GpuSampler", "web-sys/GpuSamplerBindingLayout", "web-sys/GpuSamplerBindingType", "web-sys/GpuSamplerDescriptor", "web-sys/GpuShaderModule", "web-sys/GpuShaderModuleDescriptor", "web-sys/GpuStencilFaceState", "web-sys/GpuStencilOperation", "web-sys/GpuStorageTextureAccess", "web-sys/GpuStorageTextureBindingLayout", "web-sys/GpuStoreOp", "web-sys/GpuTexelCopyBufferLayout", "web-sys/GpuTexelCopyTextureInfo", "web-sys/GpuTexture", "web-sys/GpuTextureAspect", "web-sys/GpuTextureBindingLayout", "web-sys/GpuTextureDescriptor", "web-sys/GpuTextureDimension", "web-sys/GpuTextureFormat", "web-sys/GpuTextureSampleType", "web-sys/GpuTextureView", "web-sys/GpuTextureViewDescriptor", "web-sys/GpuTextureViewDimension", "web-sys/GpuVertexAttribute", "web-sys/GpuVertexBufferLayout", "web-sys/GpuVertexFormat", "web-sys/GpuVertexState", "web-sys/GpuVertexStepMode"]
audio = ["dotlottie", "dep:rodio", "dep:ndk-context", "web-sys/HtmlAudioElement", "web-sys/HtmlMediaElement", "web-sys/Blob", "web-sys/BlobPropertyBag", "web-sys/Url"]
audio-wav = ["audio", "rodio?/wav"]
audio-flac = ["audio", "rodio?/flac"]
audio-ogg = ["audio", "rodio?/vorbis"]
audio-m4a = ["audio", "rodio?/mp4"]

[dependencies]
rustc-hash = "2.1.1"
thiserror = "2"
oorandom = "11"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"], optional = true }
bitflags = { version = "2.6", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "mp3"] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2.130"
js-sys = "0.3"
nostd-printf = "0.1.4"
tinyrlibc = { version = "0.5.1", default-features = false, features = [
    "alloc",
    "atoi",
    "isdigit",
    "isspace",
    "qsort",
    "strcat",
    "strchr",
    "strcmp",
    "strcpy",
    "strncasecmp",
    "strncmp",
    "strstr",
    "strtol",
    "strtoul",
] }
web-sys = { version = "=0.3.107", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[build-dependencies]
bindgen = "0.73"
cbindgen = { version = "0.29.2", optional = true }
cc = { version = "1.2", features = ["parallel"] }
minreq = { version = "3", features = ["https-native-tls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
dotlottie-rs = { path = ".", features = ["dev"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
gl = "0.14"

[[example]]
name = "opengl"
required-features = ["tvg-gl"]

[[example]]
name = "player"
required-features = ["theming"]

[[example]]
name = "slots"
test = true

[[example]]
name = "state_machine"
required-features = ["state-machines"]

[[bench]]
name = "benchmarks"
harness = false
