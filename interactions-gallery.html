<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dotlottie-rs · paint-fx gallery</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --ink: #14161b;
    --panel: #1c1f26;
    --line: #2b2f3a;
    --text: #e8e9ec;
    --muted: #8b90a0;
    --accent: #33e0b0;
    --tag: #ffb454;
  }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 28px 32px 60px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  h1 em { color: var(--accent); font-style: normal; }
  .sub { color: var(--muted); font-size: 13px; }
  #status {
    margin-left: auto;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  #status.ok { color: var(--accent); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .card .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
  }
  .card .num { color: var(--accent); }
  .card .title { font-weight: 600; }
  .card .hint { margin-left: auto; color: var(--muted); font-size: 11px; }
  .stage {
    position: relative;
    background-image: radial-gradient(circle, #262a34 1px, transparent 1px);
    background-size: 16px 16px;
    line-height: 0;
  }
  canvas { width: 100%; height: auto; display: block; touch-action: none; }
  .ops {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
  }
  .ops span {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 10.5px;
    color: var(--tag);
    background: rgba(255, 180, 84, 0.08);
    border: 1px solid rgba(255, 180, 84, 0.25);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .controls input[type="range"] { flex: 1; accent-color: var(--accent); }
  .controls select, .controls button {
    background: var(--ink);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    font: 12px ui-monospace, Menlo, monospace;
    padding: 4px 8px;
    cursor: pointer;
  }
  .controls button:focus-visible, .controls select:focus-visible,
  .controls input:focus-visible { outline: 2px solid var(--accent); }
  #error {
    display: none;
    background: #3a1d21;
    border: 1px solid #a33;
    color: #ffb3b3;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>dotlottie-rs <em>paint-fx</em> gallery</h1>
  <span class="sub">micro-interactions on the rendered animation — set_transform + ThorVG paint ops</span>
  <span id="status">loading wasm…</span>
</header>
<div id="error"></div>
<div class="grid" id="grid"></div>

<script type="module">
const ASSETS = "dotlottie-rs/assets/animations/lottie/";
const SIZE = 340;
const statusEl = document.getElementById("status");
const grid = document.getElementById("grid");

function fail(msg) {
  const e = document.getElementById("error");
  e.style.display = "block";
  e.textContent = msg;
  statusEl.textContent = "error";
}

// ── 3x3 row-major matrix helpers (canvas-pixel space) ──────────────────
const I = () => [1, 0, 0, 0, 1, 0, 0, 0, 1];
const T = (x, y) => [1, 0, x, 0, 1, y, 0, 0, 1];
const S = (sx, sy) => [sx, 0, 0, 0, sy, 0, 0, 0, 1];
const R = (deg) => {
  const r = (deg * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
  return [c, -s, 0, s, c, 0, 0, 0, 1];
};
function mul(a, b) {
  const o = new Array(9);
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++)
      o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c];
  return o;
}
const around = (cx, cy, m) => mul(T(cx, cy), mul(m, T(-cx, -cy)));
const setT = (p, m) => p.set_transform(new Float32Array(m));

// Critically damped-ish spring. Returns new [value, velocity].
function spring(cur, vel, target, dt, k = 180, d = 16) {
  const a = -k * (cur - target) - d * vel;
  vel += a * dt;
  cur += vel * dt;
  return [cur, vel];
}

// ── Card factory ───────────────────────────────────────────────────────
let mod;
const cards = [];

function makeCard({ num, title, hint, ops, anim, controls, setup }) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="head"><span class="num">${num}</span>
      <span class="title">${title}</span><span class="hint">${hint}</span></div>
    <div class="stage"><canvas width="${SIZE}" height="${SIZE}"></canvas></div>
    <div class="ops">${ops.map((o) => `<span>${o}</span>`).join("")}</div>
    ${controls ? `<div class="controls">${controls}</div>` : ""}`;
  grid.appendChild(el);
  const canvas = el.querySelector("canvas");
  const ctx = canvas.getContext("2d");

  const player = new mod.DotLottiePlayerWasm();
  if (!player.setup_sw_target(SIZE, SIZE)) throw new Error(`${title}: setup_sw_target failed`);

  const card = { el, canvas, ctx, player, update: null, anim };
  card.ready = fetch(ASSETS + anim)
    .then((r) => r.text())
    .then((data) => {
      if (!player.load_animation(data)) throw new Error(`${title}: load failed`);
      player.set_loop(true);
      player.play();
      setup?.(card);
    });
  cards.push(card);
  return card;
}

function blit(card) {
  const px = card.player.get_pixel_buffer();
  const clamped = new Uint8ClampedArray(px.buffer, px.byteOffset, px.byteLength);
  card.ctx.clearRect(0, 0, SIZE, SIZE);
  card.ctx.putImageData(new ImageData(clamped, SIZE, SIZE), 0, 0);
}

// Pointer position helper in canvas pixel coords.
function track(card, onMove, onLeave) {
  card.canvas.addEventListener("pointermove", (e) => {
    const r = card.canvas.getBoundingClientRect();
    onMove(((e.clientX - r.left) / r.width) * SIZE, ((e.clientY - r.top) / r.height) * SIZE, e);
  });
  card.canvas.addEventListener("pointerleave", () => onLeave?.());
}

// ── Boot ───────────────────────────────────────────────────────────────
try {
  mod = await import("./release/wasm/dotlottie_rs.js");
  await mod.default({ module_or_path: "./release/wasm/dotlottie_rs_bg.wasm" });
} catch (err) {
  fail("wasm load failed: " + err.message + " — run `make wasm` and serve the repo root.");
  throw err;
}

const C = SIZE / 2;

// 01 · hover spring-scale ------------------------------------------------
makeCard({
  num: "01", title: "hover spring-scale", hint: "hover me",
  ops: ["set_transform"], anim: "bouncy_ball.json",
  setup(card) {
    let s = 1, v = 0, target = 1;
    card.canvas.addEventListener("pointerenter", () => (target = 1.14));
    card.canvas.addEventListener("pointerleave", () => (target = 1));
    card.update = (dt) => {
      [s, v] = spring(s, v, target, dt);
      setT(card.player, around(C, C, S(s, s)));
    };
  },
});

// 02 · magnetic pull -----------------------------------------------------
makeCard({
  num: "02", title: "magnetic pull", hint: "move cursor",
  ops: ["set_transform"], anim: "toggle.json",
  setup(card) {
    let x = 0, y = 0, vx = 0, vy = 0, tx = 0, ty = 0;
    track(card, (mx, my) => { tx = (mx - C) * 0.35; ty = (my - C) * 0.35; },
      () => { tx = 0; ty = 0; });
    card.update = (dt) => {
      [x, vx] = spring(x, vx, tx, dt, 120, 12);
      [y, vy] = spring(y, vy, ty, dt, 120, 12);
      setT(card.player, T(x, y));
    };
  },
});

// 03 · tilt card ---------------------------------------------------------
makeCard({
  num: "03", title: "tilt card", hint: "move cursor",
  ops: ["set_transform"], anim: "gradient.json",
  setup(card) {
    let rx = 0, ry = 0, vrx = 0, vry = 0, trx = 0, try_ = 0;
    track(card, (mx, my) => { trx = (mx - C) / C; try_ = (my - C) / C; },
      () => { trx = 0; try_ = 0; });
    card.update = (dt) => {
      [rx, vrx] = spring(rx, vrx, trx, dt, 140, 14);
      [ry, vry] = spring(ry, vry, try_, dt, 140, 14);
      // Affine fake-3D: rotation + axis-asymmetric squash + slight skew.
      const m = mul(R(rx * 4), [1 - Math.abs(ry) * 0.06, ry * 0.05, 0,
                                rx * 0.05, 1 - Math.abs(rx) * 0.06, 0, 0, 0, 1]);
      setT(card.player, around(C, C, m));
    };
  },
});

// 04 · springy drag ------------------------------------------------------
makeCard({
  num: "04", title: "springy drag & toss", hint: "drag me",
  ops: ["set_transform"], anim: "bouncy_ball.json",
  setup(card) {
    let x = 0, y = 0, vx = 0, vy = 0, dragging = false, sx = 0, sy = 0;
    let lastX = 0, lastY = 0, lastT = 0;
    card.canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      card.canvas.setPointerCapture(e.pointerId);
      sx = e.clientX - x; sy = e.clientY - y;
      lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
    });
    card.canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      x = e.clientX - sx; y = e.clientY - sy;
      const now = performance.now(), dt = Math.max(1, now - lastT);
      vx = ((e.clientX - lastX) / dt) * 1000; vy = ((e.clientY - lastY) / dt) * 1000;
      lastX = e.clientX; lastY = e.clientY; lastT = now;
    });
    const drop = () => (dragging = false);
    card.canvas.addEventListener("pointerup", drop);
    card.canvas.addEventListener("pointercancel", drop);
    card.update = (dt) => {
      if (!dragging) { [x, vx] = spring(x, vx, 0, dt, 90, 9); [y, vy] = spring(y, vy, 0, dt, 90, 9); }
      setT(card.player, T(x, y));
    };
  },
});

// 05 · blur-in entrance --------------------------------------------------
makeCard({
  num: "05", title: "blur-in entrance", hint: "replay ↓",
  ops: ["add_gaussian_blur", "clear_effects", "set_opacity"], anim: "gradient.json",
  controls: `<button data-act="replay">replay entrance</button>`,
  setup(card) {
    let t0 = performance.now();
    card.el.querySelector("[data-act=replay]").onclick = () => (t0 = performance.now());
    card.update = () => {
      const t = Math.min(1, (performance.now() - t0) / 900);
      const e = 1 - (1 - t) * (1 - t); // ease-out
      card.player.clear_effects();
      if (e < 0.995) card.player.add_gaussian_blur((1 - e) * 12, 0, 0, 50);
      card.player.set_opacity(Math.round(e * 255));
    };
  },
});

// 06 · hover elevation ---------------------------------------------------
makeCard({
  num: "06", title: "hover elevation", hint: "hover me",
  ops: ["add_drop_shadow", "set_transform"], anim: "toggle.json",
  setup(card) {
    let t = 0, v = 0, target = 0;
    card.canvas.addEventListener("pointerenter", () => (target = 1));
    card.canvas.addEventListener("pointerleave", () => (target = 0));
    card.update = (dt) => {
      [t, v] = spring(t, v, target, dt, 150, 15);
      const s = 0.82 + t * 0.06;
      setT(card.player, around(C, C, S(s, s)));
      card.player.clear_effects();
      card.player.add_drop_shadow(0, 0, 0, 170, 90, 4 + t * 10, 4 + t * 8, 50);
    };
  },
});

// 07 · disabled → enabled ------------------------------------------------
makeCard({
  num: "07", title: "disabled → enabled", hint: "toggle ↓",
  ops: ["add_tritone", "set_opacity"], anim: "toggle.json",
  controls: `<button data-act="toggle">enable</button><span data-role="state">disabled</span>`,
  setup(card) {
    let g = 0, v = 0, target = 0;
    const btn = card.el.querySelector("[data-act=toggle]");
    const state = card.el.querySelector("[data-role=state]");
    btn.onclick = () => {
      target = target ? 0 : 1;
      btn.textContent = target ? "disable" : "enable";
      state.textContent = target ? "enabled" : "disabled";
    };
    card.update = (dt) => {
      [g, v] = spring(g, v, target, dt, 120, 14);
      const gc = Math.max(0, Math.min(1, g));
      card.player.clear_effects();
      if (gc < 0.995)
        card.player.add_tritone(40, 40, 40, 128, 128, 128, 225, 225, 225, Math.round(gc * 255));
      card.player.set_opacity(Math.round(150 + gc * 105));
    };
  },
});

// 08 · opacity fade ------------------------------------------------------
makeCard({
  num: "08", title: "opacity fade", hint: "slide ↓",
  ops: ["set_opacity"], anim: "gradient.json",
  controls: `<span>0</span><input type="range" min="0" max="255" value="255" /><span>255</span>`,
  setup(card) {
    const range = card.el.querySelector("input");
    card.update = () => card.player.set_opacity(parseInt(range.value, 10));
  },
});

// 09 · blend modes -------------------------------------------------------
makeCard({
  num: "09", title: "blend vs background", hint: "pick mode ↓",
  ops: ["set_blend_mode", "set_background"], anim: "bouncy_ball.json",
  controls: `<select>
      <option value="0">normal</option><option value="1">multiply</option>
      <option value="2" selected>screen</option><option value="3">overlay</option>
      <option value="6">color dodge</option><option value="10">difference</option>
      <option value="16">add</option>
    </select><span data-role="bg">bg hue cycling</span>`,
  setup(card) {
    const sel = card.el.querySelector("select");
    const apply = () => card.player.set_blend_mode(parseInt(sel.value, 10));
    sel.onchange = apply;
    apply();
    card.update = (_dt, now) => {
      const h = (now / 40) % 360, x = (1 - Math.abs(((h / 60) % 2) - 1)) * 255;
      const [r, g, b] = h < 60 ? [255, x, 0] : h < 120 ? [x, 255, 0] : h < 180 ? [0, 255, x]
        : h < 240 ? [0, x, 255] : h < 300 ? [x, 0, 255] : [255, 0, x];
      card.player.set_background(Math.round(r * 0.55), Math.round(g * 0.55), Math.round(b * 0.55), 255);
    };
  },
});

// 10 · per-layer wiggle --------------------------------------------------
makeCard({
  num: "10", title: "per-layer wiggle (R)", hint: "hover me",
  ops: ["set_layer_transform", "clear_layer_props"], anim: "test.json",
  setup(card) {
    let hovering = false;
    card.canvas.addEventListener("pointerenter", () => (hovering = true));
    card.canvas.addEventListener("pointerleave", () => {
      hovering = false;
      card.player.clear_layer_props("R");
    });
    card.update = (_dt, now) => {
      if (!hovering) return;
      const wob = Math.sin(now / 60) * 60; // picture-space px (1500-wide comp)
      card.player.set_layer_transform("R", new Float32Array(T(wob, Math.cos(now / 90) * 30)));
    };
  },
});

// 11 · per-layer fade ----------------------------------------------------
makeCard({
  num: "11", title: "per-layer fade (E)", hint: "slide ↓",
  ops: ["set_layer_opacity"], anim: "test.json",
  controls: `<span>E:</span><input type="range" min="0" max="255" value="255" />`,
  setup(card) {
    const range = card.el.querySelector("input");
    card.update = () => card.player.set_layer_opacity("E", parseInt(range.value, 10));
  },
});

// ── Single render loop ─────────────────────────────────────────────────
await Promise.all(cards.map((c) => c.ready)).catch((err) => fail(err.message));

let last = 0, frames = 0, fpsLast = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
  const dtMs = last ? now - last : 16;
  last = now;
  for (const card of cards) {
    card.update?.(dt, now);
    let drew = card.player.tick(dtMs);
    if (!drew) drew = card.player.render();
    if (drew) blit(card);
  }
  frames++;
  if (now - fpsLast > 1000) {
    statusEl.textContent = `wasm ok · ${cards.length} players · ${Math.round((frames * 1000) / (now - fpsLast))} fps`;
    statusEl.className = "ok";
    frames = 0;
    fpsLast = now;
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
